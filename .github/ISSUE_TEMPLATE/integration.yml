name: Agent or client integration
description: Request an agent connection or share a tested client configuration.
title: "[Integration]: "
labels: ["integration"]
body:
  - type: input
    id: client
    attributes:
      label: Agent or client
      placeholder: Client name and version
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection needed
      options:
        - MCP shared context
        - Automatic replies using an API
        - Automatic replies using a local CLI
        - Unsure
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Your workflow and desired outcome
      description: Explain what you want the agent to do and why existing adapters do not cover it.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Official documentation or sanitized configuration
      description: Link to official protocol/authentication docs. Use placeholders for credentials.
  - type: textarea
    id: testing
    attributes:
      label: What have you tested?
      description: Include operating system, client/version and result. Leave blank if this is a request.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private account or project data.
          required: true
