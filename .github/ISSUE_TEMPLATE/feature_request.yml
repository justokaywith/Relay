name: Feature request
description: Suggest a useful improvement to Relay
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow using a fictional or sanitized example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Relay to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
  - type: markdown
    attributes:
      value: "Requests are reviewed as feedback, not guaranteed delivery commitments. Do not include secrets or private project data."
