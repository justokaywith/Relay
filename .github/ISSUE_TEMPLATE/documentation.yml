name: Documentation improvement
description: Help make setup and product guidance clearer.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Which page or section?
      description: Link to the document or name the setup step.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was confusing or missing?
      description: Explain what you tried and what you expected to learn.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: A short example or proposed wording helps. Do not include secrets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed keys, private conversations and personal information.
          required: true
